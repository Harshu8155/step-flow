spring.application.name=stepflow-auth-backend
server.port=8080

# ---- MySQL datasource ----
# createDatabaseIfNotExist=true is a fallback; normally you run schema.sql first.
spring.datasource.url=jdbc:mysql://localhost:3306/stepflow_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Harsh@8155
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Tables are pre-made via src/main/resources/schema.sql, so Hibernate does NOT
# manage the schema. Options:
#   none     -> use the tables exactly as created by schema.sql (current)
#   validate -> verify entities match the tables on startup (fails fast on drift)
#   update   -> let Hibernate create/alter tables if you skip schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# IMPORTANT: replace this with your own long random secret (>= 32 chars for HS256).
app.jwt.secret=change-this-to-a-long-random-secret-at-least-32-bytes-long-000
# access token lifetime: 15 minutes
app.jwt.access-expiration-ms=900000
# refresh token lifetime: 7 days
app.jwt.refresh-expiration-ms=604800000

# ---- Email verification / deep link ----
# Base URL used to build the verification link that gets emailed.
# Inside the Android emulator, 10.0.2.2 = your PC's localhost, so the link is reachable
# when you tap it in the emulator's Gmail. (Real phone: use your PC's LAN IP.)
app.base-url=http://192.168.1.3:8080
# The deep link the verify page redirects into. The controller appends ?token=...
# The app's Verify screen reads that token, exchanges it, and logs the user in.
app.deep-link=stepflowapp://verify
# Verification link lifetime: 24 hours
app.verification-expiration-ms=86400000
# Gmail requires "from" to match the sending account below.
app.mail.from=pharshu.2003@gmail.com

# ---- SMTP (Gmail) ----
# Fill in your Gmail address and a 16-char App Password (NOT your normal password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pharshu.2003@gmail.com
spring.mail.password=hkdmtezdnmcttrsp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
